<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost & Found Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container wide">
        <h1>Campus Lost & Found</h1>
        <a href="{{ url_for('report') }}" class="btn">Report an Item</a>

        <form method="GET" action="{{ url_for('home') }}" class="filters">
            <input type="text" name="q" placeholder="Search items..." value="{{ q }}">

            <select name="type">
                <option value="">Lost & Found</option>
                <option value="lost" {% if selected_type == 'lost' %}selected{% endif %}>Lost</option>
                <option value="found" {% if selected_type == 'found' %}selected{% endif %}>Found</option>
            </select>

            <select name="category">
                <option value="">All categories</option>
                {% for c in categories %}
                    <option value="{{ c }}" {% if selected_category == c %}selected{% endif %}>{{ c }}</option>
                {% endfor %}
            </select>

            <button type="submit">Search</button>
            <a href="{{ url_for('home') }}">Clear</a>
        </form>

        {% if items %}
            {% for item in items %}
                <div class="card">
                    <span class="badge {{ item.type }}">{{ item.type|upper }}</span>
                    <h3><a href="{{ url_for('item_detail', item_id=item._id) }}">{{ item.name }}</a></h3>
                    <p>{{ item.category }} · {{ item.location }} · {{ item.date }}</p>
                </div>
            {% endfor %}
        {% else %}
            <p>No items found.</p>
        {% endif %}
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
